<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DEVNS Review Workbench</title>
<style>
  :root {
    --bg: #f6f4ef;
    --bg-2: #efece5;
    --surface: #ffffff;
    --surface-sunk: #faf8f3;
    --line: #e6e1d6;
    --line-strong: #d6d0c2;
    --ink: #1d1c1a;
    --ink-2: #4a4742;
    --ink-3: #7a766d;
    --ink-4: #a39e92;
    --accent: #b6532c;
    --accent-soft: #f3e3d8;
    --accent-ink: #6f2f17;
    --ready: #4b6cb0;
    --ready-bg: #e6ecf6;
    --progress: #b6532c;
    --progress-bg: #f6e6db;
    --done: #4f7a4a;
    --done-bg: #e4ecdf;
    --blocked: #a85a17;
    --blocked-bg: #f5e7d3;
    --failed: #9e3a36;
    --failed-bg: #f3dcd9;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  .app { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; min-height: 560px; }
  .topbar {
    display: flex; align-items: center; gap: 18px;
    height: 54px; padding: 0 18px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .brand {
    display: flex; align-items: center; gap: 9px;
    padding-right: 16px; border-right: 1px solid var(--line);
    min-width: 220px;
  }
  .mark {
    display: grid; place-items: center;
    width: 24px; height: 24px;
    border-radius: 4px;
    background: var(--ink); color: var(--bg);
    font-family: var(--mono); font-size: 11px; font-weight: 700;
  }
  .brand-name { font-weight: 650; }
  .brand-sub { color: var(--ink-3); font-family: var(--mono); font-size: 11px; }
  .queue { display: flex; align-items: center; gap: 13px; min-width: 0; overflow: hidden; }
  .qpill { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); white-space: nowrap; font-size: 12px; }
  .qpill b { color: var(--ink); font-family: var(--mono); font-size: 12px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-4); flex: 0 0 auto; }
  .dot.ready { background: var(--ready); }
  .dot.in_progress { background: var(--progress); }
  .dot.done { background: var(--done); }
  .dot.blocked { background: var(--blocked); }
  .dot.failed { background: var(--failed); }
  .spacer { flex: 1; }
  .toolbar { display: flex; align-items: center; gap: 8px; }
  .file-btn, .menu-btn {
    display: inline-flex; align-items: center; gap: 7px;
    min-height: 30px; padding: 0 10px;
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    background: var(--surface-sunk);
    cursor: pointer;
    font-size: 12px;
  }
  .file-btn:hover, .menu-btn:hover { background: var(--bg-2); }
  .file-btn input { display: none; }
  .hook {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 8px; border-radius: 999px;
    background: var(--done-bg); color: var(--done);
    font-size: 11px; font-weight: 700; letter-spacing: .02em;
  }
  .workspace {
    display: grid;
    grid-template-columns: 318px minmax(0, 1fr) 338px;
    min-height: 0;
    overflow: hidden;
  }
  .col { min-height: 0; display: flex; flex-direction: column; background: var(--surface); }
  .col + .col { border-left: 1px solid var(--line); }
  .col-head {
    display: flex; align-items: center; justify-content: space-between;
    min-height: 40px; padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    background: var(--surface-sunk);
  }
  .col-head h2 {
    margin: 0; color: var(--ink-3); font-size: 11px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase;
  }
  .count { color: var(--ink-3); font-family: var(--mono); font-size: 11px; }
  .filters { display: flex; gap: 4px; flex-wrap: wrap; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .filter {
    border: 1px solid transparent;
    background: transparent;
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
  }
  .filter:hover { background: var(--bg-2); }
  .filter.active { background: var(--ink); color: var(--bg); }
  .search { padding: 0 10px 8px; border-bottom: 1px solid var(--line); }
  .search input {
    width: 100%; padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface-sunk);
    outline: none;
  }
  .search input:focus { border-color: var(--line-strong); background: var(--surface); }
  .tasks { overflow-y: auto; flex: 1; min-height: 0; }
  .task {
    position: relative;
    display: grid; grid-template-columns: 1fr auto; gap: 4px 10px;
    padding: 10px 14px 11px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .task::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: transparent; }
  .task:hover { background: var(--surface-sunk); }
  .task.selected { background: var(--accent-soft); }
  .task.selected::before { background: var(--accent); }
  .task-id { color: var(--ink-3); font-family: var(--mono); font-size: 10.5px; }
  .task-title { grid-column: 1 / -1; font-weight: 560; line-height: 1.35; }
  .task-row { grid-column: 1 / -1; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; color: var(--ink-3); font-size: 11px; }
  .chip, .pri {
    display: inline-flex; align-items: center; gap: 5px;
    height: 18px; padding: 0 6px;
    border-radius: 3px;
    font-size: 10.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .03em;
  }
  .chip.ready { color: var(--ready); background: var(--ready-bg); }
  .chip.in_progress { color: var(--progress); background: var(--progress-bg); }
  .chip.done { color: var(--done); background: var(--done-bg); }
  .chip.blocked { color: var(--blocked); background: var(--blocked-bg); }
  .chip.failed { color: var(--failed); background: var(--failed-bg); }
  .pri { border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font-family: var(--mono); }
  .pri.p0 { color: var(--failed); background: #fbeceb; border-color: #e9c8c6; }
  .pri.p1 { color: var(--accent); background: #f7e7d9; border-color: #e7cdbb; }
  .pri.p2 { color: var(--ready); background: #eaf0f9; border-color: #cdd5e8; }
  .risk { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); }
  .risk i { display: block; width: 4px; height: 9px; border-radius: 1px; background: var(--line-strong); }
  .risk .bars { display: inline-flex; gap: 2px; }
  .risk.low i:nth-child(1) { background: var(--done); }
  .risk.medium i:nth-child(-n+2) { background: #b48a2a; }
  .risk.high i { background: var(--failed); }
  .main { overflow-y: auto; flex: 1; min-height: 0; }
  .detail { max-width: 940px; padding: 18px 24px 64px; }
  .detail-head {
    display: flex; flex-direction: column; gap: 8px;
    margin-bottom: 18px; padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
  }
  .crumb { display: flex; gap: 8px; color: var(--ink-3); font-family: var(--mono); font-size: 11px; }
  h1 { margin: 0; font-size: 20px; line-height: 1.3; letter-spacing: 0; }
  .description { max-width: 74ch; color: var(--ink-2); font-size: 13.5px; }
  .meta { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
  .block { margin-bottom: 22px; }
  .block h3 {
    display: flex; align-items: center; gap: 8px;
    margin: 0 0 8px; color: var(--ink-3);
    font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  }
  .hint { color: var(--ink-4); font-family: var(--mono); font-size: 10.5px; text-transform: none; letter-spacing: 0; }
  .panel { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); overflow: hidden; }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 12px; background: var(--surface-sunk); border-bottom: 1px solid var(--line);
  }
  .panel-title { font-weight: 700; font-size: 12px; }
  .panel-sub { color: var(--ink-3); font-family: var(--mono); font-size: 11px; }
  .panel-body { padding: 11px 12px 12px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 10px; }
  .mini-title { margin-bottom: 4px; color: var(--ink-3); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  ul.clean { margin: 0; padding-left: 17px; color: var(--ink-2); font-size: 12.5px; }
  .checklist { list-style: none; padding: 0; margin: 0; }
  .checklist li {
    display: grid; grid-template-columns: 18px 1fr auto; gap: 8px;
    padding: 7px 0; border-bottom: 1px dashed var(--line);
  }
  .checklist li:last-child { border-bottom: 0; }
  .mark {
    width: 14px; height: 14px; margin-top: 2px;
    display: grid; place-items: center;
    border-radius: 3px; border: 1px solid var(--line-strong); color: transparent;
  }
  .mark.ok { background: var(--done); border-color: var(--done); color: white; }
  .mark.ok::after { content: "v"; font-size: 10px; font-weight: 700; }
  .tag { color: var(--ink-3); font-family: var(--mono); font-size: 10.5px; }
  .vgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .vlist { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .vlist-head {
    display: flex; justify-content: space-between;
    padding: 7px 10px; background: var(--surface-sunk); border-bottom: 1px solid var(--line);
    color: var(--ink-3); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  }
  .vlist ul { margin: 0; padding: 0; list-style: none; }
  .vlist li { display: flex; gap: 8px; align-items: center; padding: 7px 10px; border-bottom: 1px solid var(--line); }
  .vlist li:last-child { border-bottom: 0; }
  .vname { flex: 1; color: var(--ink-2); font-family: var(--mono); font-size: 12px; }
  .vstatus { padding: 1px 6px; border-radius: 3px; background: var(--bg-2); color: var(--ink-3); font-family: var(--mono); font-size: 10.5px; }
  .vstatus.pass, .vstatus.passed { color: var(--done); background: var(--done-bg); }
  .vstatus.fail, .vstatus.failed { color: var(--failed); background: var(--failed-bg); }
  .vstatus.pending { color: var(--blocked); background: var(--blocked-bg); }
  .evidence-row {
    display: grid; grid-template-columns: 88px 1fr auto; gap: 10px;
    padding: 9px 0; border-bottom: 1px dashed var(--line);
  }
  .evidence-row:last-child { border-bottom: 0; }
  .kind { color: var(--ink-3); font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; }
  .ref { padding: 1px 5px; border-radius: 3px; background: var(--accent-soft); color: var(--accent-ink); font-family: var(--mono); font-size: 11.5px; }
  .artifact-refs { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
  .artifact-refs code {
    max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    padding: 2px 5px; border: 1px solid var(--line); border-radius: 4px;
    background: var(--surface-sunk); color: var(--ink-3); font-family: var(--mono); font-size: 10.5px;
  }
  .when { color: var(--ink-3); font-family: var(--mono); font-size: 10.5px; white-space: nowrap; }
  .files { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; font-family: var(--mono); font-size: 12px; }
  .frow { display: grid; grid-template-columns: 58px 1fr; gap: 10px; padding: 7px 10px; border-bottom: 1px solid var(--line); }
  .frow:last-child { border-bottom: 0; }
  .frow.head { background: var(--surface-sunk); color: var(--ink-3); font-family: var(--sans); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .fpath { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .timeline { margin-left: 4px; padding-left: 14px; border-left: 2px solid var(--line); }
  .event { position: relative; padding-bottom: 12px; }
  .event::before { content: ""; position: absolute; left: -19px; top: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line-strong); }
  .event.ok::before { border-color: var(--done); }
  .event.warn::before { border-color: var(--blocked); }
  .event.fail::before { border-color: var(--failed); }
  .event.run::before { border-color: var(--progress); background: var(--progress); }
  .event-head { display: flex; flex-wrap: wrap; gap: 10px; }
  .event-title { font-weight: 560; }
  .event-body { margin-top: 2px; color: var(--ink-2); }
  .review { overflow-y: auto; flex: 1; min-height: 0; }
  .review-section { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .review-section h4 {
    display: flex; align-items: center; justify-content: space-between;
    margin: 0 0 8px; color: var(--ink-3);
    font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  }
  .aux { color: var(--ink-4); font-family: var(--mono); font-size: 10.5px; text-transform: none; letter-spacing: 0; }
  .decision { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .decision button {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 34px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--surface); cursor: pointer; color: var(--ink-2);
  }
  .decision button.active { border-color: var(--ink); background: var(--bg-2); color: var(--ink); font-weight: 700; }
  textarea.notes {
    width: 100%; min-height: 78px; resize: vertical;
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--surface-sunk); outline: none;
  }
  .verification-summary { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .vstat { border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; background: var(--surface); }
  .vstat .n { font-family: var(--mono); font-size: 17px; font-weight: 700; line-height: 1.1; }
  .vstat .l { margin-top: 2px; color: var(--ink-3); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .vstat.pass .n { color: var(--done); }
  .vstat.fail .n { color: var(--failed); }
  .commit-line { padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-sunk); font-family: var(--mono); word-break: break-word; }
  .hash { color: var(--accent-ink); }
  .missing-list { list-style: none; margin: 0; padding: 0; }
  .missing-list li { display: grid; grid-template-columns: 16px 1fr; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--line); color: var(--ink-2); }
  .missing-list li:last-child { border-bottom: 0; }
  .missing-list li::before { content: "!"; display: grid; place-items: center; width: 16px; height: 16px; border-radius: 3px; background: var(--blocked-bg); color: var(--blocked); font-family: var(--mono); font-weight: 700; font-size: 11px; }
  .missing-list li.ok::before { content: "v"; background: var(--done-bg); color: var(--done); }
  .summary-bar {
    display: grid; grid-template-columns: 260px 1fr 300px;
    min-height: 132px; max-height: 200px;
    border-top: 1px solid var(--line); background: var(--surface);
  }
  .summary-side, .summary-right { padding: 14px 18px; background: var(--surface-sunk); }
  .summary-side { border-right: 1px solid var(--line); }
  .summary-right { border-left: 1px solid var(--line); }
  .summary-side h3, .summary-right h3 {
    display: flex; justify-content: space-between;
    margin: 0 0 7px; color: var(--ink-3);
    font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  }
  .big { margin-top: 4px; color: var(--ink); font-size: 17px; font-weight: 650; }
  .since { display: flex; gap: 14px; margin-top: 8px; color: var(--ink-3); font-size: 11px; }
  .since b { display: block; color: var(--ink); font-family: var(--mono); font-size: 13px; }
  .milestones { display: flex; gap: 10px; overflow-x: auto; padding: 12px; }
  .ms-card { flex: 0 0 220px; display: flex; flex-direction: column; gap: 7px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
  .ms-head { display: flex; justify-content: space-between; gap: 8px; }
  .ms-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 650; }
  .bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--bg-2); }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 10px; color: var(--ink-3); font-size: 11px; }
  .needs-attn { list-style: none; margin: 0; padding: 0; }
  .needs-attn li { display: flex; gap: 8px; padding: 5px 0; border-bottom: 1px dashed var(--line); cursor: pointer; }
  .nid { min-width: 64px; color: var(--ink-3); font-family: var(--mono); font-size: 10.5px; }
  .nm { flex: 1; }
  .ntag { padding: 0 4px; border-radius: 3px; background: var(--failed-bg); color: var(--failed); font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .empty { padding: 10px 0; color: var(--ink-3); }
  .mode-note {
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface-sunk);
    color: var(--ink-3);
    font-size: 12px;
  }
  .scrim { display: none; }
  @media (max-width: 980px) {
    .app { height: auto; min-height: 100vh; }
    .workspace { grid-template-columns: 1fr; overflow: visible; }
    .col.list, .col.review { display: none; }
    .summary-bar { grid-template-columns: 1fr; max-height: none; }
    .summary-side, .summary-right { border: 0; border-top: 1px solid var(--line); }
    .grid-3, .vgrid { grid-template-columns: 1fr; }
    .toolbar .hook { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="mark">NS</div>
      <div>
        <div class="brand-name">DEVNS Review</div>
        <div class="brand-sub" id="projectName">loading</div>
      </div>
    </div>
    <div class="queue" id="queueBar"></div>
    <div class="spacer"></div>
    <div class="toolbar">
      <span class="hook"><span class="dot done"></span><span id="hookState">static</span></span>
      <label class="file-btn">Open JSON <input id="fileInput" type="file" accept=".json,application/json" /></label>
    </div>
  </header>
  <main class="workspace">
    <aside class="col list">
      <div class="col-head"><h2>Queue</h2><span class="count" id="queueCount">0 features</span></div>
      <div class="filters" id="filters"></div>
      <div class="search"><input id="searchInput" placeholder="Filter by id, title, milestone..." /></div>
      <div class="tasks" id="taskList"></div>
    </aside>
    <section class="col main">
      <div class="detail" id="detail"></div>
    </section>
    <aside class="col review">
      <div class="col-head"><h2>Review</h2><span class="count" id="reviewState">pending</span></div>
      <div id="reviewPanel"></div>
    </aside>
  </main>
  <footer class="summary-bar">
    <div class="summary-side">
      <h3>Morning Review</h3>
      <div class="when" id="sumStamp">static snapshot</div>
      <div class="big" id="sumBig">No data loaded</div>
      <div class="since">
        <div><b id="sumDone">0</b><span>done</span></div>
        <div><b id="sumReady">0</b><span>ready</span></div>
        <div><b id="sumBlocked">0</b><span>blocked</span></div>
        <div><b id="sumFailed">0</b><span>failed</span></div>
      </div>
    </div>
    <div class="milestones" id="milestones"></div>
    <div class="summary-right">
      <h3>Needs attention <span class="ntag" id="naCount">0</span></h3>
      <ul class="needs-attn" id="needsAttn"></ul>
    </div>
  </footer>
</div>
<script>
const fallbackInventory = {
  project: {
    name: "DEVNS Review Workbench",
    description: "Static template. Open a DEVNS features.json file to review a real project."
  },
  features: [
    {
      id: "DEMO-001",
      title: "Open a local features.json snapshot",
      description: "This static workbench can render DEVNS feature inventory JSON. Use the Open JSON button or serve this folder so it can fetch ../features.json.",
      status: "in_progress",
      priority: "P0",
      milestone: "Demo",
      risk: "medium",
      context: [".devns/features.json"],
      acceptanceCriteria: ["Feature inventory renders in the workbench", "Human can scan RFC, evidence, risks, and stop-hook blockers"],
      verification: ["Open JSON manually", "Review selected feature"],
      evidence: [{ type: "template", summary: "Static template loaded with fallback data.", artifactRefs: [".devns/artifacts/browser-smoke/demo/run.json"] }],
      changedFiles: ["templates/workbench/index.html"],
      commit: "",
      reviewDecision: "pending",
      agentNotes: "Static mode does not write JSON. A future CLI workbench server will enable edits.",
      rfc: {
        status: "approved",
        summary: "Render DEVNS JSON as a human review surface.",
        goals: ["Fast review", "No build step", "Readable fallback"],
        requirements: [{ id: "REQ-001", type: "explicit", statement: "Render feature inventory.", priority: "must" }],
        acceptanceCriteria: [{ id: "AC-001", statement: "Features are selectable.", verification: "Open page." }],
        validationPlan: { dynamic: ["manual browser smoke"], static: [] }
      },
      history: { latestSummary: "Fallback data loaded.", recordCount: 1 }
    }
  ]
};

let inventory = fallbackInventory;
let features = [];
let selectedId = "";
let filter = "all";
let search = "";
let loadMode = "fallback";

const statusLabels = {
  ready: "Ready",
  in_progress: "In progress",
  done: "Done",
  blocked: "Blocked",
  failed: "Failed"
};
const filters = [
  ["all", "All", () => true],
  ["active", "Active", f => f.status === "ready" || f.status === "in_progress"],
  ["review", "Needs review", f => (f.reviewDecision || "pending") === "pending" && (f.status === "done" || f.status === "in_progress" || missingFor(f).length)],
  ["done", "Done", f => f.status === "done"],
  ["blocked", "Blocked", f => f.status === "blocked" || f.status === "failed"]
];
const $ = selector => document.querySelector(selector);
const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const list = value => Array.isArray(value) ? value : [];
const textList = value => list(value).map(item => typeof item === "string" ? item : item?.statement || item?.summary || item?.name || JSON.stringify(item));
const truncate = (value, size) => String(value || "").length > size ? `${String(value).slice(0, size - 1)}...` : String(value || "");

function normalizeFeature(feature) {
  const rfc = feature.rfc || {};
  const dynamic = list(rfc.validationPlan?.dynamic);
  const statik = list(rfc.validationPlan?.static);
  return {
    ...feature,
    status: feature.status || "ready",
    priority: feature.priority || "P2",
    milestone: feature.milestone || "Unscheduled",
    risk: feature.risk || "medium",
    context: list(feature.context),
    acceptanceCriteria: textList(feature.acceptanceCriteria),
    verification: textList(feature.verification),
    evidence: list(feature.evidence),
    changedFiles: list(feature.changedFiles),
    reviewDecision: feature.reviewDecision || "pending",
    agentNotes: feature.agentNotes || "",
    rfc: {
      status: rfc.status || "draft",
      summary: rfc.summary || "No RFC summary recorded.",
      goals: textList(rfc.goals),
      requirements: textList(rfc.requirements),
      acceptanceCriteria: textList(rfc.acceptanceCriteria),
      validationPlan: { dynamic, static: statik },
      risks: textList(rfc.risks)
    },
    history: feature.history || {}
  };
}

function setInventory(nextInventory, mode) {
  inventory = nextInventory?.features ? nextInventory : fallbackInventory;
  features = list(inventory.features).map(normalizeFeature);
  selectedId = features[0]?.id || "";
  loadMode = mode;
  renderAll();
}

async function autoLoad() {
  try {
    const response = await fetch("../features.json", { cache: "no-store" });
    if (!response.ok) throw new Error(String(response.status));
    setInventory(await response.json(), "auto");
  } catch {
    setInventory(fallbackInventory, "fallback");
  }
}

function counts() {
  return features.reduce((acc, feature) => {
    acc[feature.status] = (acc[feature.status] || 0) + 1;
    return acc;
  }, { ready: 0, in_progress: 0, done: 0, blocked: 0, failed: 0 });
}
function selectedFeature() {
  return features.find(feature => feature.id === selectedId) || features[0];
}
function filteredFeatures() {
  const selectedFilter = filters.find(item => item[0] === filter) || filters[0];
  const query = search.trim().toLowerCase();
  return features
    .filter(selectedFilter[2])
    .filter(feature => !query || `${feature.id} ${feature.title} ${feature.milestone}`.toLowerCase().includes(query));
}
function chip(status) {
  return `<span class="chip ${status}"><span class="dot ${status}"></span>${statusLabels[status] || status}</span>`;
}
function pri(priority) {
  return `<span class="pri ${String(priority).toLowerCase()}">${escapeHtml(priority)}</span>`;
}
function risk(risk) {
  return `<span class="risk ${risk}"><span class="bars"><i></i><i></i><i></i></span>${escapeHtml(risk)}</span>`;
}
function checkStatus(feature, text) {
  const done = feature.status === "done" || feature.evidence.length > 0;
  return `<li><span class="mark ${done ? "ok" : ""}"></span><span>${escapeHtml(text)}</span><span class="tag">${done ? "covered" : "open"}</span></li>`;
}
function validationRows(items) {
  if (!items.length) return `<li><span class="vname">No checks declared.</span><span class="vstatus">empty</span></li>`;
  return items.map(item => {
    const name = typeof item === "string" ? item : item.name || item.command || item.summary || JSON.stringify(item);
    const status = typeof item === "string" ? "pending" : item.status || "pending";
    return `<li><span class="vname">${escapeHtml(name)}</span><span class="vstatus ${escapeHtml(status)}">${escapeHtml(status)}</span></li>`;
  }).join("");
}
function evidenceRows(feature) {
  if (!feature.evidence.length) return `<div class="empty">No evidence recorded yet.</div>`;
  return feature.evidence.map(item => {
    const artifacts = list(item.artifactRefs);
    return `
    <div class="evidence-row">
      <div class="kind">${escapeHtml(item.type || item.kind || "evidence")}</div>
      <div>
        <span class="ref">${escapeHtml(item.url || item.ref || feature.id)}</span> ${escapeHtml(item.summary || item.body || "")}
        ${artifacts.length ? `<div class="artifact-refs">${artifacts.map(ref => `<code>${escapeHtml(ref)}</code>`).join("")}</div>` : ""}
      </div>
      <div class="when">now</div>
    </div>
  `;
  }).join("");
}
function fileRows(feature) {
  if (!feature.changedFiles.length) return `<div class="empty">No changed files recorded.</div>`;
  return `<div class="files"><div class="frow head"><span>File</span><span>Path</span></div>${feature.changedFiles.map(file => {
    const path = typeof file === "string" ? file : file.path || JSON.stringify(file);
    return `<div class="frow"><span>mod</span><span class="fpath">${escapeHtml(path)}</span></div>`;
  }).join("")}</div>`;
}
function historyEvents(feature) {
  const events = list(feature.events).map(event => ({
    kind: event.type === "failed" ? "fail" : event.type === "blocked" ? "warn" : event.type === "claimed" ? "run" : "ok",
    when: event.at || "",
    title: event.type || "event",
    body: event.summary || ""
  }));
  if (feature.history.latestSummary) {
    events.unshift({ kind: "ok", when: feature.history.latestRecord || "", title: "Latest history", body: feature.history.latestSummary });
  }
  if (!events.length) return `<div class="empty">No execution history recorded.</div>`;
  return `<div class="timeline">${events.map(event => `
    <div class="event ${event.kind}">
      <div class="event-head"><span class="when">${escapeHtml(event.when)}</span><span class="event-title">${escapeHtml(event.title)}</span></div>
      <div class="event-body">${escapeHtml(event.body)}</div>
    </div>
  `).join("")}</div>`;
}
function missingFor(feature) {
  const missing = [];
  if (feature.rfc.status !== "approved") missing.push("RFC is not approved.");
  if (!feature.evidence.length && feature.status !== "ready") missing.push("Verification evidence is missing.");
  if ((feature.reviewDecision || "pending") === "pending" && feature.status !== "ready") missing.push("Human review decision is pending.");
  if (!feature.commit && feature.status === "done") missing.push("Commit metadata is missing.");
  return missing;
}

function renderTopbar() {
  const project = inventory.project || {};
  const c = counts();
  $("#projectName").textContent = project.name || "DEVNS project";
  $("#hookState").textContent = loadMode === "fallback" ? "static" : "snapshot";
  $("#queueBar").innerHTML = ["ready", "in_progress", "done", "blocked", "failed"].map(status => `
    <span class="qpill"><span class="dot ${status}"></span>${statusLabels[status]} <b>${c[status] || 0}</b></span>
  `).join("");
}
function renderFilters() {
  $("#filters").innerHTML = filters.map(([id, label, predicate]) => `
    <button class="filter ${filter === id ? "active" : ""}" data-filter="${id}">${label} ${features.filter(predicate).length}</button>
  `).join("");
  document.querySelectorAll("[data-filter]").forEach(button => {
    button.addEventListener("click", () => {
      filter = button.dataset.filter;
      renderFilters();
      renderTasks();
    });
  });
}
function renderTasks() {
  const items = filteredFeatures();
  $("#queueCount").textContent = `${items.length} of ${features.length} features`;
  $("#taskList").innerHTML = items.length ? items.map(feature => `
    <div class="task ${feature.id === selectedId ? "selected" : ""}" data-id="${escapeHtml(feature.id)}">
      <div class="task-id">${escapeHtml(feature.id)} - ${escapeHtml(truncate(feature.milestone, 28))}</div>
      <div>${pri(feature.priority)}</div>
      <div class="task-title">${escapeHtml(feature.title)}</div>
      <div class="task-row">${chip(feature.status)} - ${risk(feature.risk)} - RFC ${escapeHtml(feature.rfc.status)}</div>
    </div>
  `).join("") : `<div class="empty" style="padding:14px;">No features match this filter.</div>`;
  document.querySelectorAll(".task[data-id]").forEach(node => {
    node.addEventListener("click", () => {
      selectedId = node.dataset.id;
      renderTasks();
      renderDetail();
      renderReview();
    });
  });
}
function renderDetail() {
  const feature = selectedFeature();
  if (!feature) {
    $("#detail").innerHTML = `<div class="empty">No features loaded.</div>`;
    return;
  }
  $("#detail").innerHTML = `
    <div class="detail-head">
      <div class="crumb"><span>${escapeHtml(feature.milestone)}</span><span>></span><span>${escapeHtml(feature.id)}</span><span>-</span><span>${feature.history.recordCount || 0} records</span></div>
      <h1>${escapeHtml(feature.title)}</h1>
      <div class="description">${escapeHtml(feature.description)}</div>
      <div class="meta">${chip(feature.status)} ${pri(feature.priority)} ${risk(feature.risk)} <span>RFC <b>${escapeHtml(feature.rfc.status)}</b></span> <span>Context <b>${feature.context.length}</b></span></div>
      <div class="mode-note">Static snapshot mode. This page can read JSON, but it does not write changes back to disk.</div>
    </div>
    <section class="block">
      <h3>RFC <span class="hint">${escapeHtml(feature.rfc.status)}</span></h3>
      <div class="panel">
        <div class="panel-head"><span class="panel-title">Summary</span><span class="panel-sub">${escapeHtml(feature.id)} / rfc</span></div>
        <div class="panel-body">
          <div>${escapeHtml(feature.rfc.summary)}</div>
          <div class="grid-3">
            <div><div class="mini-title">Goals</div><ul class="clean">${feature.rfc.goals.map(item => `<li>${escapeHtml(item)}</li>`).join("") || "<li>None</li>"}</ul></div>
            <div><div class="mini-title">Requirements</div><ul class="clean">${feature.rfc.requirements.map(item => `<li>${escapeHtml(item)}</li>`).join("") || "<li>None</li>"}</ul></div>
            <div><div class="mini-title">RFC acceptance</div><ul class="clean">${feature.rfc.acceptanceCriteria.map(item => `<li>${escapeHtml(item)}</li>`).join("") || "<li>None</li>"}</ul></div>
          </div>
        </div>
      </div>
    </section>
    <section class="block">
      <h3>Acceptance criteria <span class="hint">${feature.acceptanceCriteria.length}</span></h3>
      <ul class="checklist">${feature.acceptanceCriteria.map(item => checkStatus(feature, item)).join("") || "<li>No acceptance criteria declared.</li>"}</ul>
    </section>
    <section class="block">
      <h3>Validation plan</h3>
      <div class="vgrid">
        <div class="vlist"><div class="vlist-head"><span>Dynamic</span><span>${feature.rfc.validationPlan.dynamic.length}</span></div><ul>${validationRows(feature.rfc.validationPlan.dynamic)}</ul></div>
        <div class="vlist"><div class="vlist-head"><span>Static</span><span>${feature.rfc.validationPlan.static.length}</span></div><ul>${validationRows(feature.rfc.validationPlan.static)}</ul></div>
      </div>
    </section>
    <section class="block"><h3>Evidence</h3><div class="panel"><div class="panel-body">${evidenceRows(feature)}</div></div></section>
    <section class="block"><h3>Changed files</h3>${fileRows(feature)}</section>
    <section class="block"><h3>Execution history</h3>${historyEvents(feature)}</section>
  `;
}
function renderReview() {
  const feature = selectedFeature();
  if (!feature) return;
  const missing = missingFor(feature);
  const dynamicCount = feature.rfc.validationPlan.dynamic.length;
  const staticCount = feature.rfc.validationPlan.static.length;
  $("#reviewState").textContent = feature.reviewDecision;
  $("#reviewPanel").innerHTML = `
    <div class="review-section">
      <h4>Human decision <span class="aux">${escapeHtml(feature.reviewDecision)}</span></h4>
      <div class="decision">
        ${["pending", "approved", "needs_changes", "follow_up"].map(value => `<button class="${feature.reviewDecision === value ? "active" : ""}" type="button">${escapeHtml(value)}</button>`).join("")}
      </div>
    </div>
    <div class="review-section">
      <h4>Agent notes <span class="aux">${feature.history.recordCount || 0} records</span></h4>
      <textarea class="notes" readonly>${escapeHtml(feature.agentNotes || "")}</textarea>
    </div>
    <div class="review-section">
      <h4>Verification summary</h4>
      <div class="verification-summary">
        <div class="vstat pass"><div class="n">${feature.evidence.length}</div><div class="l">evidence</div></div>
        <div class="vstat"><div class="n">${dynamicCount}</div><div class="l">dynamic</div></div>
        <div class="vstat"><div class="n">${staticCount}</div><div class="l">static</div></div>
      </div>
    </div>
    <div class="review-section">
      <h4>Commit</h4>
      <div class="commit-line">${feature.commit ? `<span class="hash">${escapeHtml(typeof feature.commit === "string" ? feature.commit : feature.commit.hash || "")}</span>` : "no commit recorded"}</div>
    </div>
    <div class="review-section">
      <h4>Stop hook blockers <span class="aux">${missing.length} open</span></h4>
      <ul class="missing-list">${missing.length ? missing.map(item => `<li>${escapeHtml(item)}</li>`).join("") : `<li class="ok">No obvious blockers in this snapshot.</li>`}</ul>
    </div>
  `;
}
function renderSummary() {
  const c = counts();
  $("#sumStamp").textContent = loadMode === "auto" ? "Loaded from ../features.json" : loadMode === "file" ? "Loaded from selected file" : "Fallback demo data";
  $("#sumBig").textContent = `${c.done || 0} done, ${(c.blocked || 0) + (c.failed || 0)} need attention`;
  $("#sumDone").textContent = c.done || 0;
  $("#sumReady").textContent = c.ready || 0;
  $("#sumBlocked").textContent = c.blocked || 0;
  $("#sumFailed").textContent = c.failed || 0;
  const groups = new Map();
  features.forEach(feature => {
    const group = groups.get(feature.milestone) || { done: 0, ready: 0, blocked: 0, failed: 0, in_progress: 0 };
    group[feature.status] = (group[feature.status] || 0) + 1;
    groups.set(feature.milestone, group);
  });
  $("#milestones").innerHTML = [...groups.entries()].map(([name, group]) => {
    const total = Math.max(1, Object.values(group).reduce((sum, value) => sum + value, 0));
    const seg = (count, color) => count ? `<span style="width:${count / total * 100}%;background:${color}"></span>` : "";
    return `<div class="ms-card"><div class="ms-head"><span class="ms-name">${escapeHtml(name)}</span><span class="when">${total}</span></div><div class="bar">${seg(group.done, "var(--done)")}${seg(group.in_progress, "var(--progress)")}${seg(group.ready, "var(--ready)")}${seg(group.blocked, "var(--blocked)")}${seg(group.failed, "var(--failed)")}</div><div class="legend"><span>${group.done || 0} done</span><span>${group.ready || 0} ready</span><span>${group.blocked || 0} blocked</span></div></div>`;
  }).join("");
  const attention = features.filter(feature => feature.status === "blocked" || feature.status === "failed" || missingFor(feature).length).slice(0, 6);
  $("#naCount").textContent = attention.length;
  $("#needsAttn").innerHTML = attention.length ? attention.map(feature => `<li data-id="${escapeHtml(feature.id)}"><span class="nid">${escapeHtml(feature.id)}</span><span class="nm">${escapeHtml(feature.title)}</span><span class="ntag">${escapeHtml(feature.status)}</span></li>`).join("") : `<li><span class="nm">No attention items.</span></li>`;
  document.querySelectorAll("#needsAttn [data-id]").forEach(node => node.addEventListener("click", () => {
    selectedId = node.dataset.id;
    renderTasks();
    renderDetail();
    renderReview();
  }));
}
function renderAll() {
  renderTopbar();
  renderFilters();
  renderTasks();
  renderDetail();
  renderReview();
  renderSummary();
}
$("#searchInput").addEventListener("input", event => {
  search = event.target.value;
  renderTasks();
});
$("#fileInput").addEventListener("change", async event => {
  const file = event.target.files?.[0];
  if (!file) return;
  setInventory(JSON.parse(await file.text()), "file");
});
document.addEventListener("keydown", event => {
  if (["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName)) return;
  const items = filteredFeatures();
  const index = items.findIndex(feature => feature.id === selectedId);
  if (event.key === "j" || event.key === "ArrowDown") {
    event.preventDefault();
    selectedId = items[Math.min(items.length - 1, Math.max(0, index + 1))]?.id || selectedId;
    renderTasks(); renderDetail(); renderReview();
  }
  if (event.key === "k" || event.key === "ArrowUp") {
    event.preventDefault();
    selectedId = items[Math.max(0, index - 1)]?.id || selectedId;
    renderTasks(); renderDetail(); renderReview();
  }
});
autoLoad();
</script>
</body>
</html>
